[package]
name = "drogue-es-wifi"
version = "0.1.4"
authors = ["Bob McWhirter <bmcwhirt@redhat.com>"]
edition = "2018"
license = "Apache-2.0"
description = "Inventek eS-WiFi offload board interface via SPI"
repository = "https://github.com/drogue-iot/drogue-es-wifi"
keywords = [ "driver", "spi", "inventek", "wifi", "no_std" ]
categories = ["no-std", "embedded"]
readme = "README.md"


[dependencies]
embedded-hal = {version = "0.2.4", features = ["unproven"] }
embedded-nal = { version = "0.6.0", optional = true }
embedded-time = "0.10.0"
nb = "1.0.0"
log = "0.4.11"
heapless = "0.5.6"
drogue-embedded-timer = "0.2.1"
drogue-network = "0.2.0"
drogue-nom-utils = "0.1.0"
nom = { version = "5.1.2", default-features = false }

# The optional `embedded-nal` dependency implicitly gates `nal::NalTcpStack`
# (an `embedded_nal::TcpClientStack` wrapper) behind a feature of the same name.

[features]
# Driver-level TCP/DNS byte and op counters, readable via `NalTcpStack::net_stats()`.
# Off by default and zero-cost when unused. The module runs its own on-chip stack and
# exposes no counters, so they are tallied here instead (as winc-rs does for its part).
net-stats = []
# Optional fault injection for testing recovery paths: an armable hook that can make
# DNS resolution fail (or return the `0.0.0.0` wedge sentinel) and `connect` fail on
# demand, without touching the module. Compiled out entirely when the feature is off.
fault-injection = []
